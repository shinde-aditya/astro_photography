<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Astro-fest — Pimpri Chinchwad Science Park</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<!-- ============================================================ -->

<!--  Also paste the public URL of your hosted upload.html below   -->
<!--  so the corner QR code sends people to the right place.       -->
<!-- ============================================================ -->
<script>
  const FIREBASE_CONFIG = {
    apiKey: "AIzaSyC7LpImCkF3HDhsR2ulNaasFkLu9mXfXKY",
    authDomain: "pimpari-chinchwad-science-park.firebaseapp.com",
    projectId: "pimpari-chinchwad-science-park",
    appId: "1:177842243658:web:bc1a08d9acd21cc06e3eb3"
  };
  const COLLECTION_NAME = "skyPhotos";
  const UPLOAD_URL = "https://r0vx6rbh-5500.inc1.devtunnels.ms/upload.html";
  const DEFAULT_MODE = 'last48'; // used when admin has not chosen a mode yet: 'all' | 'today' | 'last48'
  const SLIDE_SECONDS = 7;      // how long each photo stays on screen
  const MAX_PHOTOS = 150;       // how many recent photos to keep in rotation
  const FIT_MODE = 'smart';     // 'smart' = fill screen when little is cropped, else show whole photo
                                // 'cover' = always fill the screen (crops edges)
                                // 'contain' = always show the whole photo (may leave bars)
  const SMART_MIN_VISIBLE = 0.6; // smart mode: fill screen only if at least this share of the photo stays visible (0.1-1)
  const OVERLAY_UI = true;      // true = title, caption and QR float over the photo so it uses the full screen
</script>
<!-- ============================================================ -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.13.2/firebase-app-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.13.2/firebase-firestore-compat.min.js"></script>

<style>
  :root{
    --navy:#0a0e28; --gold:#f4b942; --cloud:#f4f2ec; --mist:#9aa0cc;
    /* every size scales from the smaller screen side, so it fits any display */
    --u: min(1vw, 1vh);
    --pad: clamp(8px, calc(var(--u) * 1.6), 24px);
    --qr: clamp(56px, calc(var(--u) * 9), 100px);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;overflow:hidden;background:var(--navy);}
  body{
    font-family:'IBM Plex Sans', sans-serif;
    color:var(--cloud);
    position:relative;
    /* normal flow layout: header / photo area / footer. Nothing is overlaid, so nothing can collide */
    display:flex;flex-direction:column;
    height:100vh;height:100dvh;
    padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);
  }
  .stars{position:fixed;inset:0;z-index:0;pointer-events:none;}
  .stars span{
    position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;
    opacity:.5;animation:twinkle 4s ease-in-out infinite;
  }
  @keyframes twinkle{0%,100%{opacity:.12}50%{opacity:.8}}

  .progress{
    position:fixed;top:0;left:0;height:3px;background:var(--gold);
    z-index:7;width:0%;
  }

  header{
    position:relative;z-index:5;flex:none;
    padding:calc(var(--pad) * .8) var(--pad) calc(var(--pad) * .5);
    display:flex;align-items:baseline;justify-content:space-between;gap:var(--pad);
  }
  header .title{
    font-family:'Fraunces', serif;font-weight:600;
    font-size:clamp(.95rem, calc(var(--u) * 2.4), 1.6rem);letter-spacing:.01em;
  }
  header .title span{color:var(--gold);font-style:italic;}
  header .count{font-size:clamp(.75rem, calc(var(--u) * 1.7), 1rem);color:var(--mist);margin:0;}

  /* photo area takes ALL remaining space between header and footer */
  .stageWrap{
    position:relative;z-index:1;flex:1 1 0;min-height:0;
    margin:0;
  }
  .stage{position:absolute;inset:0;}
  .slide{
    position:absolute;inset:0;
    display:flex;align-items:center;justify-content:center;
    opacity:0;
    transition:opacity 1.1s ease;
  }
  .slide.active{opacity:1;z-index:2;}
  .slide .bg{
    position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;
    object-fit:cover;z-index:-1;
    filter:blur(32px) brightness(.45) saturate(1.2);
    transform:scale(1.15);   /* hides blurred edges */
  }
  .slide .photo.cover{object-fit:cover;object-position:center;}
  body.overlay .stageWrap{position:absolute;inset:0;margin:0;}
  body.overlay header{position:absolute;top:0;left:0;right:0;
    background:linear-gradient(180deg,rgba(10,14,40,.7),transparent);pointer-events:none;
    padding-bottom:calc(var(--pad) * 1.6);}
  body.overlay .bar{position:absolute;bottom:0;left:0;right:0;
    background:linear-gradient(0deg,rgba(10,14,40,.7),transparent);
    padding-top:calc(var(--pad) * 1.6);}
  .slide .photo{
    width:100%;height:100%;
    object-fit:contain;      /* whole photo visible: no crop, no stretch */
    image-rendering:auto;
  }

  /* footer: caption + QR sit side by side (wide screens) or stacked (tall screens) */
  .bar{
    position:relative;z-index:6;flex:none;
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
    gap:var(--pad);
    padding:calc(var(--pad) * .5) var(--pad) calc(var(--pad) * .8);
  }
  .caption{
    grid-column:2;
    text-align:center;
    max-width:min(70vw, 900px);
    background:rgba(10,14,40,.55);
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    padding:calc(var(--u) * .8) calc(var(--u) * 2.4);
    border-radius:100px;
    border:1px solid rgba(255,255,255,.12);
    opacity:0;transition:opacity .6s ease;
  }
  .caption.on{opacity:1;}
  .caption .name{font-size:clamp(.85rem, calc(var(--u) * 2), 1.3rem);font-weight:600;overflow-wrap:anywhere;}
  .caption .loc{font-size:clamp(.7rem, calc(var(--u) * 1.5), 1rem);color:var(--mist);margin-top:1px;overflow-wrap:anywhere;}
  .caption .loc:empty{display:none;}

  .corner{
    grid-column:3;justify-self:end;
    display:flex;align-items:center;gap:calc(var(--u) * 1.6);
    background:rgba(10,14,40,.7);
    border:1px solid rgba(255,255,255,.14);
    padding:calc(var(--u) * .8);
    padding-right:calc(var(--u) * 1.6);
    border-radius:16px;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  }
  .corner img{width:var(--qr);height:var(--qr);flex:none;border-radius:8px;background:#fff;padding:5px;}
  .corner .txt{font-size:clamp(.7rem, calc(var(--u) * 1.6), 1rem);color:var(--mist);line-height:1.35;max-width:14ch;}
  .corner .txt b{color:var(--cloud);display:block;font-size:1.1em;margin-bottom:2px;}

  /* tall / portrait screens: caption left, QR right on one slim row (photo keeps the height) */
  @media (max-aspect-ratio: 1/1){
    .bar{grid-template-columns:1fr auto;gap:calc(var(--pad) * .8);}
    .caption{grid-column:1;max-width:100%;border-radius:20px;}
    .corner{grid-column:2;}
    .corner .txt{max-width:11ch;}
  }
  /* very short screens: drop the QR text so the photo keeps room */
  @media (max-height: 420px){
    .corner .txt{display:none;}
    .corner{padding:6px;}
  }

  .empty{
    position:absolute;inset:0;z-index:1;
    display:none;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:0 var(--pad);
  }
  .empty .glyph{font-size:clamp(2.5rem, calc(var(--u) * 9), 5rem);margin-bottom:calc(var(--u) * 2);}
  .empty h1{
    font-family:'Fraunces', serif;font-weight:600;
    font-size:clamp(1.5rem, calc(var(--u) * 5.5), 3rem);margin:0 0 10px;
  }
  .empty p{color:var(--mist);font-size:clamp(.9rem, calc(var(--u) * 2.4), 1.4rem);max-width:40ch;line-height:1.5;margin:0;}

  @media (prefers-reduced-motion: reduce){
    .slide img{animation:none;}
    .stars span{animation:none;}
  }
</style>
</head>
<body>

<div class="stars" id="stars"></div>
<div class="progress" id="progress"></div>

<header>
  <div class="title">Astro-fest <span>·</span> Live</div>
  <div class="count" id="countLabel">Waiting for photos…</div>
</header>

<main class="stageWrap">
  <div class="stage" id="stage"></div>
  <div class="empty" id="emptyView">
    <span class="glyph">🌌</span>
    <h1>The Astro-fest is waiting.</h1>
    <p>Scan the QR code to send the first photo of the sun, moon, clouds or stars.</p>
  </div>
</main>

<footer class="bar">
  <div class="caption" id="caption">
    <div class="name" id="capName"></div>
    <div class="loc" id="capLoc"></div>
  </div>
  <div class="corner" id="corner" style="display:none;">
    <img id="qrImg" alt="QR code">
    <div class="txt"><b>Add your photo</b>Scan to join the Astro-fest</div>
  </div>
</footer>

<script>
  // starfield
  const starWrap = document.getElementById('stars');
  for(let i=0;i<90;i++){
    const s=document.createElement('span');
    s.style.left=Math.random()*100+'%';
    s.style.top=Math.random()*100+'%';
    s.style.animationDelay=(Math.random()*4)+'s';
    starWrap.appendChild(s);
  }

  // QR corner (only if a real URL was configured)
  if(UPLOAD_URL && !UPLOAD_URL.includes('PASTE')){
    document.getElementById('qrImg').src =
      'https://api.qrserver.com/v1/create-qr-code/?size=200x200&margin=6&data=' + encodeURIComponent(UPLOAD_URL);
    document.getElementById('corner').style.display = 'flex';
  }

  if(OVERLAY_UI) document.body.classList.add('overlay');

  firebase.initializeApp(FIREBASE_CONFIG);
  const db = firebase.firestore();

  const stage = document.getElementById('stage');
  const emptyView = document.getElementById('emptyView');
  const countLabel = document.getElementById('countLabel');
  const progressBar = document.getElementById('progress');
  const caption = document.getElementById('caption');
  const capName = document.getElementById('capName');
  const capLoc = document.getElementById('capLoc');

  let allPhotos = [];                    // newest photos, updated live
  let settings = { mode: DEFAULT_MODE, ids: [], day: '' }; // set from admin.html (mode: all | selected | day | today | last48)
  let settingsReady = false;
  let extra = {};                        // selected photos older than the live window
  let photos = [];                       // what is on screen right now
  let currentIndex = 0;
  let currentId = null;                  // id of the photo on screen now
  let lastListMode = null;
  let showNext = [];                     // new photos waiting to be shown once, newest first
  let resumeId = null;                   // photo to continue with after the new ones (no repeats)
  let slideTimer = null;
  let progressTimer = null;
  let buildToken = 0;

  // ---- day / today modes: a live query for one calendar day (device's local time) ----
  let dayPhotos = [], dayActiveKey = null, dayUnsub = null;
  const pad2 = (n) => String(n).padStart(2, '0');
  const dateKey = (d) => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  function stopDay(){
    if(dayUnsub){ dayUnsub(); dayUnsub = null; }
    dayActiveKey = null; dayPhotos = [];
  }
  const H48 = 48 * 3600 * 1000, SLOT = 10 * 60 * 1000;
  // what the wall should be watching right now: a calendar day, or a rolling 48-hour window
  function currentRange(){
    if(settings.mode === 'last48'){
      const slot = Math.floor(Date.now() / SLOT);            // window refreshes every 10 min
      return { key: 'last48-' + slot, start: new Date(slot * SLOT - H48), end: null };
    }
    const key = settings.mode === 'today' ? dateKey(new Date()) : settings.day;
    const [y, m, d] = key.split('-').map(Number);
    return { key: key, start: new Date(y, m - 1, d), end: new Date(y, m - 1, d + 1) };
  }
  function watchRange(r){
    if(dayActiveKey === r.key) return;
    stopDay();
    dayActiveKey = r.key;
    let q = db.collection(COLLECTION_NAME).where('createdAt', '>=', r.start);
    if(r.end) q = q.where('createdAt', '<', r.end);
    dayUnsub = q.orderBy('createdAt', 'desc').limit(MAX_PHOTOS)
      .onSnapshot((snap) => {
        dayPhotos = snap.docs.map(x => Object.assign({ id: x.id }, x.data()));
        rebuild();
      }, () => { countLabel.textContent = 'Connection issue — check Firebase setup.'; });
  }
  // "Always show today": switch to the new date at midnight, no action needed
  setInterval(() => {
    if((settings.mode === 'today' || settings.mode === 'last48') && currentRange().key !== dayActiveKey) rebuild();
  }, 30000);

  const IMG_OK = /^data:image\/(jpeg|jpg|png|webp);base64,[A-Za-z0-9+\/=]+$/;
  const validPhoto = (p) => p && typeof p.image === 'string' && IMG_OK.test(p.image);
  const toTime = (p) => (p.createdAt && p.createdAt.toMillis) ? p.createdAt.toMillis() : 0;

  async function rebuild(){
    if(!settingsReady) return;
    const token = ++buildToken;
    if(settings.mode === 'day' || settings.mode === 'today' || settings.mode === 'last48'){
      watchRange(currentRange());
      let list = dayPhotos.filter(validPhoto);
      if(settings.mode === 'last48'){ const cut = Date.now() - H48; list = list.filter(p => toTime(p) >= cut); }
      showPhotos(list, settings.mode);
      return;
    }
    stopDay();
    if(settings.mode !== 'selected'){ showPhotos(allPhotos.filter(validPhoto), 'all'); return; }

    const live = {};
    allPhotos.forEach(p => live[p.id] = p);
    const missing = settings.ids.filter(id => !live[id] && !(id in extra));
    for(let i = 0; i < missing.length; i += 30){
      const chunk = missing.slice(i, i + 30);
      try{
        const snap = await db.collection(COLLECTION_NAME)
          .where(firebase.firestore.FieldPath.documentId(), 'in', chunk).get();
        const found = new Set();
        snap.forEach(d => { extra[d.id] = Object.assign({ id: d.id }, d.data()); found.add(d.id); });
        chunk.forEach(id => { if(!found.has(id)) extra[id] = null; });   // deleted
      }catch(e){}
      if(token !== buildToken) return;      // a newer update took over
    }
    const list = settings.ids
      .map(id => live[id] || extra[id])
      .filter(validPhoto)
      .sort((a, b) => toTime(b) - toTime(a));
    showPhotos(list, 'selected');
  }

  function showPhotos(list, mode){
    const prevIds = new Set(photos.map(p => p.id));
    const hadPhotos = prevIds.size > 0 && lastListMode === mode;
    const hasNew = hadPhotos && list.some(p => !prevIds.has(p.id));
    if(!hadPhotos){ showNext = []; resumeId = null; }
    lastListMode = mode;
    photos = list;
    const n = photos.length;
    if(mode === 'selected') countLabel.textContent = n + (n === 1 ? ' featured photo' : ' featured photos');
    else if(mode === 'last48') countLabel.textContent = n + (n === 1 ? ' photo' : ' photos') + ' · last 48 hours';
    else if(mode === 'today') countLabel.textContent = n + (n === 1 ? ' photo today' : ' photos today');
    else if(mode === 'day'){
      const [yy, mm, dd] = settings.day.split('-').map(Number);
      const label = new Date(yy, mm - 1, dd).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });
      countLabel.textContent = label + ' · ' + n + (n === 1 ? ' photo' : ' photos');
    }
    else countLabel.textContent = n + (n === 1 ? ' photo shared' : ' photos shared');
    if(n === 0){
      emptyView.style.display = 'flex';
      stage.innerHTML = '';
      caption.classList.remove('on');
      clearInterval(slideTimer); slideTimer = null;
      progressBar.style.transition = 'none'; progressBar.style.width = '0%';
      return;
    }
    emptyView.style.display = 'none';
    if(!slideTimer){ currentIndex = 0; renderCurrent(); startTimer(); }
    else if(hasNew){
      // new photo(s) arrived: show the newest right away, queue any others,
      // then carry on from where the slideshow was (no already-shown photos repeat)
      const fresh = list.filter(p => !prevIds.has(p.id)).sort((a, b) => toTime(b) - toTime(a));
      const freshIds = new Set(fresh.map(p => p.id));
      if(!resumeId){
        const cur = photos.findIndex(p => p.id === currentId);
        if(cur >= 0){
          for(let k = 1; k <= n; k++){
            const cand = photos[(cur + k) % n];
            if(!freshIds.has(cand.id) && cand.id !== currentId){ resumeId = cand.id; break; }
          }
        }
      }
      showNext = fresh.slice(1).map(p => p.id).concat(showNext.filter(id => !freshIds.has(id)));
      currentIndex = photos.findIndex(p => p.id === fresh[0].id);
      renderCurrent(); startTimer();
    }else{
      // keep showing the same photo even if the list shifted (deletes, mode refresh)
      const i = photos.findIndex(p => p.id === currentId);
      currentIndex = i >= 0 ? i : (currentIndex >= n ? 0 : currentIndex);
    }
  }

  // live photos
  db.collection(COLLECTION_NAME)
    .orderBy('createdAt', 'desc')
    .limit(MAX_PHOTOS)
    .onSnapshot((snap) => {
      allPhotos = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
      rebuild();
    }, (err) => {
      countLabel.textContent = 'Connection issue — check Firebase setup.';
    });

  // which photos the admin chose to show (settings/display, written by admin.html)
  db.collection('settings').doc('display').onSnapshot((doc) => {
    const d = doc.exists ? doc.data() : {};
    const day = (typeof d.day === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(d.day)) ? d.day : '';
    let mode = ['all', 'selected', 'day', 'today', 'last48'].includes(d.mode) ? d.mode : DEFAULT_MODE;
    if(mode === 'day' && !day) mode = DEFAULT_MODE;
    settings = { mode: mode, ids: Array.isArray(d.ids) ? d.ids : [], day: day };
    extra = {};
    settingsReady = true;
    rebuild();
  }, () => {
    settings = { mode: DEFAULT_MODE, ids: [], day: '' };   // can't read settings: use the safe default, not everything
    settingsReady = true;
    rebuild();
  });

  function renderCurrent(){
    if(!photos.length) return;
    const p = photos[currentIndex % photos.length];
    currentId = p.id;
    const slide = document.createElement('div');
    slide.className = 'slide';
    slide.innerHTML = `<img class="bg" src="${p.image}" alt=""><img class="photo" src="${p.image}" alt="Sky photo">`;
    const photoEl = slide.querySelector('.photo');
    const fit = () => {
      const nw = photoEl.naturalWidth, nh = photoEl.naturalHeight;
      const sw = stage.clientWidth, sh = stage.clientHeight;
      if(!nw || !nh || !sw || !sh) return;
      const ra = nw / nh, rs = sw / sh;
      const visible = Math.min(ra / rs, rs / ra);   // share of the photo still visible when filling
      const fill = FIT_MODE === 'cover' || (FIT_MODE === 'smart' && visible >= SMART_MIN_VISIBLE);
      photoEl.classList.toggle('cover', fill);
    };
    if(photoEl.complete) fit(); else photoEl.addEventListener('load', fit);
    // caption lives in the footer (never overlaps the photo or the QR code)
    capName.textContent = p.name || 'A visitor';
    capLoc.textContent = p.location || '';
    caption.classList.add('on');
    stage.appendChild(slide);
    // fade in new, remove old after transition
    requestAnimationFrame(() => slide.classList.add('active'));
    const oldSlides = [...stage.children].slice(0, -1);
    oldSlides.forEach(s => setTimeout(() => s.remove(), 1200));
  }

  // order: new photos first (once), then continue where we left off, then normal rotation
  function nextIndex(){
    while(showNext.length){
      const i = photos.findIndex(p => p.id === showNext.shift());
      if(i >= 0) return i;
    }
    if(resumeId){
      const i = photos.findIndex(p => p.id === resumeId);
      resumeId = null;
      if(i >= 0) return i;
    }
    return (currentIndex + 1) % photos.length;
  }

  function startTimer(){
    clearInterval(slideTimer);
    clearInterval(progressTimer);
    tickProgress();
    slideTimer = setInterval(() => {
      currentIndex = nextIndex();
      renderCurrent();
      tickProgress();
    }, SLIDE_SECONDS * 1000);
  }

  function tickProgress(){
    progressBar.style.transition = 'none';
    progressBar.style.width = '0%';
    requestAnimationFrame(() => {
      progressBar.style.transition = `width ${SLIDE_SECONDS}s linear`;
      progressBar.style.width = '100%';
    });
  }

  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }
</script>
</body>
</html>
